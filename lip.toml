format = 4
id = "github.com/wzyyyyyyy/LeviWineBridge"
version = "0.1.3"

[info]
name = "LeviWineBridge"
logo = "https://raw.githubusercontent.com/wzyyyyyyy/LeviWineBridge/v0.1.3/icon.png"
description = "LeviLamina client plugin for Minecraft Bedrock in Wine: bridges Xbox sign-in and native interactive console, auto-installs CJK fallback font (msyh.ttc), and fixes Wine input/PreLoader issues."
tags = ["utility", "bugfix"]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">=0.0.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviWineBridge-client-windows-x64.zip"]
place = [{ src = "LeviClient/", dest = "mods/LeviClient/" }]
